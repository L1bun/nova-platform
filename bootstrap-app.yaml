apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-platform-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/L1bun/nova-platform-gitops.git
    targetRevision: main
    path: charts/web-service
    helm:
      valueFiles:
        - ../../environments/dev/web-service-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
